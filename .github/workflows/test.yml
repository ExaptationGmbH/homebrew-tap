name: test

# Runs on formula PRs (including the auto-bump PRs, which are dispatched
# explicitly by bump.yml) and manual dispatch. Not on push, so seeding a
# placeholder formula never produces a red run.
on:
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      # brew audit/test only accept a tap-qualified NAME, not a path, so link
      # this checkout in as the ExaptationGmbH/tap tap.
      - name: Register checkout as a tap
        run: |
          set -euo pipefail
          tap_dir="$(brew --repository)/Library/Taps/exaptationgmbh/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

      - name: Audit, install and test each formula
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in Formula/*.rb; do
            name=$(basename "$f" .rb)
            ref="ExaptationGmbH/tap/${name}"
            echo "::group::$name"
            brew audit --strict "$ref"
            brew install "$ref"
            brew test "$ref"
            expected=$(grep -E '^\s*version\s+"' "$f" | head -1 | sed -E 's/.*version\s+"([^"]+)".*/\1/')
            actual=$("$name" version || true)
            echo "expected=$expected actual=$actual"
            case "$actual" in
              *"$expected"*) echo "version ok" ;;
              *) echo "::error::$name version '$actual' did not contain '$expected'"; exit 1 ;;
            esac
            echo "::endgroup::"
          done
